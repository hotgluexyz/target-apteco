[tool.poetry]
name = "target-apteco"
version = "0.0.1"
description = "`target-apteco` is a Singer target for Apteco CDP, built with the Meltano Singer SDK."
readme = "README.md"
authors = ["Jacob Mazurkiewicz <jacob@hotglue.io>"]
keywords = [
    "ELT",
    "apteco",
]
license = "Apache-2.0"

[tool.poetry.dependencies]
python = "<3.11,>=3.7.1"
requests = "^2.31.0"
backoff = ">=1.8.0,<2.0"
hotglue-singer-sdk = "^1.0.7"
hotglue-etl-exceptions = "0.1.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"

[tool.poetry.extras]
s3 = ["fs-s3fs"]

[tool.ruff]
ignore = [
    "ANN101",  # missing-type-self
    "ANN102",  # missing-type-cls
]
select = ["ALL"]
src = ["target_apteco"]
target-version = "py37"

[tool.ruff.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.isort]
known-first-party = ["target_apteco"]

[tool.ruff.pydocstyle]
convention = "google"

[build-system]
requires = ["poetry-core>=1.0.8"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
target-apteco = 'target_apteco.target:TargetApteco.cli'
