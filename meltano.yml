version: 1
send_anonymous_usage_stats: true
project_id: "target-apteco"
default_environment: test
environments:
- name: test
plugins:
  extractors: []
  loaders:
  - name: "target-apteco"
    namespace: "target_apteco"
    pip_url: -e .
    capabilities:
    - about
    - stream-maps
    - record-flattening
    settings:
    - name: username
    - name: password
      kind: password
    - name: base_url
      value: https://hotglue.ca-1.apteco.cloud
    - name: data_view_name
      value: DB01
    - name: cdp_source_name
      value: "Blackbaud Raiser's Edge"
